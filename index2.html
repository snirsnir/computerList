<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מערכת ניהול מחשבים - טכנודע</title>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
  :root{
    --bg:#eef2f7; --panel:#fff; --ink:#1f2933; --muted:#6b7785; --line:#dfe5ec;
    --brand:#0b5fa5; --brand2:#0a4a83;
    --a1:#b00020; --a3:#f76707; --a5:#e8c500; --a6:#8bc34a; --a8:#2e7d32; --a0:#9aa5b1;
    --gold:#ffd24d;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Segoe UI",Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:60px}
  header{
    background:linear-gradient(135deg,var(--brand2),var(--brand)); color:#fff; padding:16px 22px;
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
    box-shadow:0 2px 12px rgba(0,0,0,.15); position:sticky; top:0; z-index:50;
  }
  header h1{font-size:19px; font-weight:700; white-space:nowrap}
  .kpis{display:flex; gap:9px; flex-wrap:wrap; margin-inline-start:auto}
  .kpi{background:rgba(255,255,255,.15); border-radius:8px; padding:5px 13px; text-align:center; min-width:78px}
  .kpi b{display:block; font-size:18px; line-height:1.2}
  .kpi span{font-size:11px; opacity:.9}
  #conn{font-size:12px; padding:5px 12px; border-radius:20px; background:rgba(255,255,255,.2); white-space:nowrap}
  #conn.ok{background:#2e7d32} #conn.off{background:#b00020} #conn.warn{background:#b26a00}

  .toolbar{
    background:var(--panel); border-bottom:1px solid var(--line); padding:11px 22px;
    display:flex; gap:9px; flex-wrap:wrap; align-items:center; position:sticky; top:60px; z-index:40;
  }
  input[type=text],input[type=number],select{
    font-family:inherit; font-size:14px; padding:7px 11px;
    border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink);
  }
  input[type=text]{min-width:200px}
  button{font-family:inherit; font-size:14px; font-weight:600; padding:7px 15px; border:0; border-radius:8px;
    background:var(--brand); color:#fff; cursor:pointer; transition:filter .15s}
  button:hover{filter:brightness(1.12)}
  button.ghost{background:#fff; color:var(--brand); border:1px solid var(--brand)}
  button.danger{background:#b00020}
  button.sm{padding:3px 9px; font-size:12px}
  .seg{display:flex; border:1px solid var(--brand); border-radius:8px; overflow:hidden}
  .seg button{border-radius:0; background:#fff; color:var(--brand); padding:7px 14px}
  .seg button.on{background:var(--brand); color:#fff}

  .legend{display:flex; gap:13px; flex-wrap:wrap; padding:9px 22px; font-size:12px; color:var(--muted)}
  .legend i{display:inline-block; width:11px; height:11px; border-radius:3px; margin-inline-end:5px; vertical-align:-1px}

  main{padding:18px 22px}
  main.cards{display:grid; grid-template-columns:340px 1fr; gap:18px; align-items:start}
  @media (max-width:1100px){ main.cards{grid-template-columns:1fr} }
  main.table{display:block}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden}
  .panel > h2{font-size:15px; padding:11px 15px; background:#f6f8fb; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px}
  .panel > h2 .cnt{margin-inline-start:auto; font-size:12px; color:var(--muted); font-weight:500}
  .pool{max-height:calc(100vh - 230px); overflow-y:auto; padding:10px; min-height:110px}
  .zones{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:15px}
  .zone{background:var(--panel); border:1px solid var(--line); border-radius:12px; display:flex; flex-direction:column}
  .zhead{background:#f6f8fb; padding:9px 13px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:7px}
  .zhead .zname{font-weight:700; font-size:15px; flex:1; cursor:text}
  .zhead .zc{font-size:12px; color:var(--muted); background:#fff; border:1px solid var(--line); border-radius:20px; padding:1px 9px}
  .drop{padding:9px; min-height:80px; flex:1}
  .drop.over{background:#e3f0fb; outline:2px dashed var(--brand); outline-offset:-6px; border-radius:8px}

  .card{background:#fff; border:1px solid var(--line); border-inline-start:5px solid var(--a0);
    border-radius:9px; padding:8px 10px; margin-bottom:7px; cursor:grab; box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .card:active{cursor:grabbing}
  .card.dragging{opacity:.4}
  .card .t{display:flex; align-items:baseline; gap:7px}
  .card .name{font-weight:700; font-size:14px; flex:1}
  .card .qty{background:var(--brand); color:#fff; font-size:12px; font-weight:700; border-radius:20px; padding:1px 9px}
  .card .meta{font-size:12px; color:var(--muted); margin-top:3px}
  .card .tags{display:flex; gap:5px; flex-wrap:wrap; margin-top:5px}
  .tag{font-size:11px; border-radius:5px; padding:2px 7px; font-weight:600; white-space:nowrap}
  .tag.gen{background:#eef1f5; color:#333}
  .tag.site{background:var(--gold); color:#5a3d00}
  .tag.act{background:#dfe3ff; color:#00308f}
  .card .row2{display:flex; gap:5px; margin-top:6px; align-items:center}
  .card select{font-size:11px; padding:3px 5px; border-radius:6px; flex:1; min-width:0}
  .card .note{font-size:11px; padding:3px 5px; border-radius:6px; flex:1.3; min-width:0}

  /* ---------- תצוגת טבלה ---------- */
  .tsec{background:var(--panel); border:1px solid var(--line); border-radius:12px; margin-bottom:15px; overflow:hidden}
  .tsec > .drop{padding:0; overflow-x:auto}
  table.grid{width:100%; border-collapse:collapse; font-size:13px; min-width:1080px}
  table.grid th{
    background:#42586e; color:#fff; font-size:12px; font-weight:600; padding:8px 9px;
    text-align:right; white-space:nowrap; position:sticky; top:0; z-index:2;
  }
  table.grid td{padding:5px 9px; border-bottom:1px solid var(--line); vertical-align:middle}
  table.grid tbody tr{cursor:grab}
  table.grid tbody tr:hover{background:#f4f8fc}
  table.grid tbody tr.dragging{opacity:.4}
  table.grid tbody tr.oldsite td:first-child{box-shadow:inset 4px 0 0 var(--gold)}
  td.loc{font-weight:700; white-space:nowrap}
  td.num{text-align:center; font-variant-numeric:tabular-nums}
  .agepill{display:inline-block; min-width:34px; text-align:center; color:#fff; font-weight:700;
    border-radius:5px; padding:1px 7px; font-size:12px}
  .urg{display:inline-block; border-radius:5px; padding:1px 7px; font-size:11px; font-weight:600; white-space:nowrap}
  table.grid select{font-size:12px; padding:2px 5px; border-radius:6px; max-width:150px}
  table.grid input.note{font-size:12px; padding:2px 6px; border-radius:6px; width:100%; min-width:110px; border:1px solid var(--line)}
  table.grid tfoot td{background:#eef2f7; font-weight:700; padding:7px 9px; border-top:2px solid var(--brand)}

  .empty{color:var(--muted); font-size:13px; text-align:center; padding:20px 10px}
  dialog{border:0; border-radius:12px; padding:0; max-width:560px; width:92%; box-shadow:0 20px 60px rgba(0,0,0,.3)}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  dialog .dh{background:var(--brand); color:#fff; padding:13px 17px; font-weight:700}
  dialog .db{padding:17px}
  dialog .df{padding:11px 17px; background:#f6f8fb; display:flex; gap:8px}
  .toast{position:fixed; bottom:18px; inset-inline-start:18px; background:#1f2933; color:#fff;
    padding:10px 17px; border-radius:9px; font-size:14px; z-index:200; box-shadow:0 6px 20px rgba(0,0,0,.3);
    opacity:0; transform:translateY(12px); transition:.25s; pointer-events:none}
  .toast.show{opacity:1; transform:none}
</style>
</head>
<body>

<header>
  <h1>🖥️ ניהול מחשבים — טכנודע</h1>
  <div class="kpis">
    <div class="kpi"><b id="kTotal">0</b><span>מחשבים</span></div>
    <div class="kpi"><b id="kRows">0</b><span>עמדות</span></div>
    <div class="kpi"><b id="kAssigned">0</b><span>משויכים</span></div>
    <div class="kpi"><b id="kAge">0</b><span>גיל ממוצע</span></div>
  </div>
  <div id="conn">מתחבר…</div>
</header>

<div class="toolbar">
  <div class="seg">
    <button id="vTable" class="on">📋 טבלה</button>
    <button id="vCards">🗂️ כרטיסים</button>
  </div>
  <input type="text" id="q" placeholder="🔍 חיפוש מיקום / דגם / מעבד…">
  <select id="fUrg"><option value="">כל רמות הדחיפות</option></select>
  <select id="fType">
    <option value="">כל הסוגים</option>
    <option value="1">סוג 1 — נייח משרדי</option>
    <option value="2">סוג 2 — נייד משרדי</option>
    <option value="3">סוג 3 — נייח מעבד חזק</option>
  </select>
  <select id="fAge">
    <option value="">כל הגילאים</option>
    <option value="10">בני 10 ומעלה</option>
    <option value="8">בני 8 ומעלה</option>
    <option value="5">בני 5 ומעלה</option>
    <option value="-4">עד 4 שנים</option>
  </select>
  <button id="bNewZone">➕ מתחם חדש</button>
  <button id="bExport" class="ghost">📊 ייצוא לאקסל</button>
  <button id="bReset" class="ghost">♻️ טעינה מחדש מהמיפוי</button>
</div>

<div class="legend">
  <span><i style="background:var(--a1)"></i>12+ שנים</span>
  <span><i style="background:var(--a3)"></i>9–11</span>
  <span><i style="background:var(--a5)"></i>6–8</span>
  <span><i style="background:var(--a6)"></i>3–5</span>
  <span><i style="background:var(--a8)"></i>עד 2</span>
  <span><i style="background:var(--gold)"></i>טכנודע ישן</span>
  <span style="margin-inline-start:auto">גרור שורה/כרטיס למתחם · או בחר מתחם בעמודה «העבר למתחם» · לחיצה כפולה על שם מתחם = שינוי שם</span>
</div>

<main id="main" class="table">
  <div id="viewTable"></div>
  <div id="viewCards" style="display:none; grid-column:1/-1"></div>
</main>

<dialog id="dlg">
  <div class="dh" id="dlgTitle"></div>
  <div class="db" id="dlgBody"></div>
  <div class="df" id="dlgFoot"></div>
</dialog>
<div class="toast" id="toast"></div>

const ROOT = "technoda";
const LS_KEY = "technoda_state_v1";
const CLIENT = "w" + Math.random().toString(36).slice(2,9);

let db = null, online = false, remoteReady = false;
let state = { computers:{}, zones:{} };
let viewMode = localStorage.getItem("technoda_view") || "table";

function setConn(txt, cls){
  const el = document.getElementById("conn");
  el.textContent = txt; el.className = cls || "";
}
function updateConn(){
  if (!db)            { setConn("● מצב מקומי (אין Firebase)", "off"); return; }
  if (!remoteReady)   { setConn("● טוען נתונים…", "warn"); return; }
  if (online)           setConn("● מסונכרן · Firebase", "ok");
  else                  setConn("● מנותק — יסונכרן כשהחיבור יחזור", "warn");
}

function initFirebase(){
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    // מאזין מצב חיבור — לתצוגה בלבד, לא חוסם את הטעינה
    db.ref(".info/connected").on("value", s => { online = !!s.val(); updateConn(); });
    return true;
  }catch(e){
    console.warn("firebase init failed", e);
    db = null; updateConn(); return false;
  }
}

function withTimeout(p, ms){
  return Promise.race([p, new Promise((_,rj)=>setTimeout(()=>rj(new Error("timeout")), ms))]);
}

function adopt(val){
  state.computers = val.computers || {};
  state.zones = val.zones || {};
  Object.values(state.computers).forEach(c => {
    if (!c.type) c.type = autoType(c);
    if (c.zone === undefined || c.zone === null) c.zone = "";
    if (c.note === undefined || c.note === null) c.note = "";
  });
  persistLocal();
}

function readLocal(){
  try{
    const p = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    if (p && p.computers && Object.keys(p.computers).length) return p;
  }catch(e){}
  return null;
}

async function loadState(){
  if (initFirebase()){
    try{
      const snap = await withTimeout(db.ref(ROOT).get(), 15000);
      const val = snap.val();
      if (val && val.computers && Object.keys(val.computers).length){
        adopt(val);
        remoteReady = true; subscribe(); updateConn();
        toast("נטענו " + Object.keys(state.computers).length + " עמדות מ-Firebase");
        return;
      }
      // Firebase ריק באמת — רק אז זורעים
      state.computers = normalize(SEED); state.zones = {};
      await db.ref(ROOT).set({computers:state.computers, zones:state.zones, updatedAt:Date.now(), writer:CLIENT});
      remoteReady = true; subscribe(); updateConn();
      toast("Firebase היה ריק — נדחפו " + SEED.length + " עמדות מהמיפוי");
      return;
    }catch(e){
      console.warn("firebase read failed", e);
      // קריטי: לא זורעים ולא כותבים כלום כשהקריאה נכשלה,
      // אחרת היינו דורסים את הנתונים של כולם בנתונים ריקים.
      remoteReady = false; updateConn();
      toast("לא הצלחתי לקרוא מ-Firebase — עובד מקומית ללא סנכרון");
    }
  }
  const local = readLocal();
  if (local){ state = local; toast("נטען מהאחסון המקומי"); return; }
  state.computers = normalize(SEED); state.zones = {};
  persistLocal();
}

function subscribe(){
  db.ref(ROOT).on("value", snap => {
    const val = snap.val();
    if (!val || !val.computers) return;
    if (val.writer === CLIENT) return;      // הד של הכתיבה שלנו
    adopt(val); render();
    toast("התקבל עדכון ממכשיר אחר");
  });
}

/* ---------- שמירה ---------- */
function persistLocal(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
}
/** כתיבה ממוקדת לנתיב אחד — לא דורסת שינויים של מכשירים אחרים */
function push(rel, value){
  persistLocal();
  if (!db || !remoteReady) return;
  const u = {}; u[rel] = value;
  u.updatedAt = Date.now(); u.writer = CLIENT;
  db.ref(ROOT).update(u).catch(e => console.warn("push failed", e));
}
/** כתיבת כמה נתיבים בבת אחת */
function pushMulti(obj){
  persistLocal();
  if (!db || !remoteReady) return;
  const u = Object.assign({}, obj, {updatedAt:Date.now(), writer:CLIENT});
  db.ref(ROOT).update(u).catch(e => console.warn("pushMulti failed", e));
}
/** כתיבה מלאה — רק לאיפוס/זריעה מכוונת */
function pushAll(){
  persistLocal();
  if (!db || !remoteReady) return;
  db.ref(ROOT).set({computers:state.computers, zones:state.zones, updatedAt:Date.now(), writer:CLIENT})
    .catch(e => console.warn("pushAll failed", e));
}

/* ============================ עזרי נתונים ============================ */
function ageOf(c){ return (c.year ? NOW_YEAR - c.year : null); }
function ageColor(a){
  if (a === null || a === undefined) return "var(--a0)";
  if (a >= 12) return "var(--a1)";
  if (a >= 9)  return "var(--a3)";
  if (a >= 6)  return "var(--a5)";
  if (a >= 3)  return "var(--a6)";
  return "var(--a8)";
}
function urgColor(u){
  if (!u) return "#eef1f5";
  if (u.indexOf("קריטי") === 0)   return "#ffd6d6";
  if (u.indexOf("דחוף") === 0)    return "#ffe0cc";
  if (u.indexOf("גבוה") === 0)    return "#ffeecc";
  if (u.indexOf("בינוני") === 0)  return "#fff8cc";
  if (u.indexOf("נמוך") === 0)    return "#e6f4d9";
  return "#dff0e0";
}
function autoType(c){
  const m = (c.model||"").toLowerCase(), loc = (c.loc||"");
  const cpu = (c.cpu||"").toLowerCase().replace(/\s/g,"");
  if (/thinkpad|latitude|ideapad|idepad|hp250|notebook|laptop|nuc/.test(m) || /נייד/.test(loc)) return 2;
  if (/i7-|i9-|coreultra|ultra/.test(cpu) || /protower/.test(m)) return 3;
  return 1;
}
const TYPE_NAMES = {1:"סוג 1 — נייח משרדי", 2:"סוג 2 — נייד משרדי", 3:"סוג 3 — נייח מעבד חזק לחוגים"};
const TYPE_SHORT = {1:"נייח משרדי", 2:"נייד משרדי", 3:"נייח מעבד חזק"};

function normalize(list){
  const out = {};
  list.forEach(c => { out[c.id] = Object.assign({}, c, {type:c.type||autoType(c), zone:c.zone||"", note:c.note||""}); });
  return out;
}
function comps(){ return Object.values(state.computers); }
function zoneList(){
  return Object.entries(state.zones)
    .map(([id,z]) => ({id, name:z.name, order:z.order||0}))
    .sort((a,b) => a.order - b.order || a.name.localeCompare(b.name,"he"));
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ============================ סינון ומיון ============================ */
function passFilter(c){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const fu = document.getElementById("fUrg").value;
  const ft = document.getElementById("fType").value;
  const fa = document.getElementById("fAge").value;
  if (q){
    const hay = [c.loc,c.model,c.cpu,c.os,c.urgency,c.action,c.note].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  if (fu && c.urgency !== fu) return false;
  if (ft && String(c.type) !== ft) return false;
  if (fa){
    const a = ageOf(c); if (a === null) return false;
    const n = parseInt(fa,10);
    if (n < 0){ if (a > -n) return false; } else if (a < n) return false;
  }
  return true;
}
function sortRows(a,b){
  const aa = ageOf(a), bb = ageOf(b);
  if (aa === null) return 1;
  if (bb === null) return -1;
  return bb - aa || b.count - a.count || a.loc.localeCompare(b.loc,"he");
}

/* ============================ רינדור ============================ */
function zoneOptions(sel){
  return `<option value=""${sel?"":" selected"}>— ללא שיוך —</option>` +
    zoneList().map(z => `<option value="${z.id}"${sel===z.id?" selected":""}>${esc(z.name)}</option>`).join("");
}

  return `<tr draggable="true" data-id="${c.id}"${c.site==="טכנודע ישן"?' class="oldsite"':''}>
    <td class="loc">${esc(c.loc)}</td>
    <td class="num"><b>${c.count}</b></td>
    <td><select data-type="${c.id}">
      <option value="1"${c.type==1?" selected":""}>נייח משרדי</option>
      <option value="2"${c.type==2?" selected":""}>נייד משרדי</option>
      <option value="3"${c.type==3?" selected":""}>נייח מעבד חזק</option>
    </select></td>
    <td>${esc(c.model||"—")}</td>

    <td class="num">${c.gen||"—"}</td>

    <td><span class="urg" style="background:${urgColor(c.urgency)}">${esc(c.urgency||"—")}</span></td>

function tableSection(title, zoneId, items, allItems, controls){

  return `<div class="tsec">
    <div class="zhead">

    <div class="drop" data-zone="${zoneId||""}">
      ${items.length ? `<table class="grid">
        <thead><tr>${TH.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${items.map(rowHTML).join("")}</tbody>
      </table>` : `<div class="empty">${allItems.length? "אין שורות שעונות על הסינון" : "גרור לכאן מחשבים, או בחר מתחם זה בעמודה «העבר למתחם»"}</div>`}
    </div>
  </div>`;
}

function renderTable(){
  const all = comps(), shown = all.filter(passFilter);
  let html = "";
  const un = shown.filter(c=>!c.zone).sort(sortRows);
  const unAll = all.filter(c=>!c.zone);
  if (unAll.length) html += tableSection("📋 מחשבים לא משויכים", "", un, unAll, "");
  zoneList().forEach(z => {
    const items = shown.filter(c=>c.zone===z.id).sort(sortRows);
    const allZ = all.filter(c=>c.zone===z.id);
    html += tableSection(z.name, z.id, items, allZ,
      `<button class="sm ghost" data-zrename="${z.id}">✏️</button><button class="sm danger" data-zdel="${z.id}">🗑️</button>`);
  });
  if (!zoneList().length && !unAll.length) html = `<div class="panel"><div class="empty">אין נתונים</div></div>`;
  if (!zoneList().length) html += `<div class="panel"><div class="empty">עדיין לא יצרת מתחמים — לחץ «➕ מתחם חדש»</div></div>`;
  document.getElementById("viewTable").innerHTML = html;
}

function cardHTML(c){
  const a = ageOf(c);
  return `<div class="card" draggable="true" data-id="${c.id}" style="border-inline-start-color:${ageColor(a)}">
    <div class="t"><span class="name">${esc(c.loc)}</span><span class="qty">${c.count}</span></div>
    <div class="meta">${esc(c.model||"—")} · ${esc(c.cpu||"ללא נתון")} · ${esc(c.os||"")}</div>
    <div class="tags">
      <span class="tag" style="background:${ageColor(a)};color:#fff">${a===null?"גיל לא ידוע":"בן "+a+" שנים"}</span>
      ${c.gen?`<span class="tag gen">דור ${c.gen}${c.year?" · "+c.year:""}</span>`:""}
      ${c.site==="טכנודע ישן"?`<span class="tag site">טכנודע ישן</span>`:""}
      ${c.action?`<span class="tag act">${esc(c.action)}</span>`:""}
    </div>
    <div class="row2">
      <select data-type="${c.id}">
        <option value="1"${c.type==1?" selected":""}>נייח משרדי</option>
        <option value="2"${c.type==2?" selected":""}>נייד משרדי</option>
        <option value="3"${c.type==3?" selected":""}>מעבד חזק</option>
      </select>
      <input class="note" data-note="${c.id}" placeholder="בעיות" value="${esc(c.note||"")}">
      <button class="sm ghost" data-split="${c.id}">✂️</button>
    </div>
  </div>`;
}

function renderCards(){
  const all = comps(), shown = all.filter(passFilter);
  const poolItems = shown.filter(c=>!c.zone).sort(sortRows);
  const poolTot = all.filter(c=>!c.zone).reduce((s,c)=>s+c.count,0);
  const zs = zoneList();
  const zonesHTML = zs.length ? zs.map(z=>{
    const items = shown.filter(c=>c.zone===z.id).sort(sortRows);
    const tot = all.filter(c=>c.zone===z.id).reduce((s,c)=>s+c.count,0);
    return `<div class="zone">
      <div class="zhead">
        <span class="zname" data-zn="${z.id}">${esc(z.name)}</span>
        <span class="zc">${tot}</span>
        <button class="sm ghost" data-zrename="${z.id}">✏️</button>
        <button class="sm danger" data-zdel="${z.id}">🗑️</button>
      </div>
      <div class="drop" data-zone="${z.id}">${items.length?items.map(cardHTML).join(""):`<div class="empty">גרור לכאן</div>`}</div>
    </div>`;
  }).join("") : `<div class="panel"><div class="empty">עדיין לא יצרת מתחמים</div></div>`;

  document.getElementById("viewCards").innerHTML =
    `<div style="display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start">
       <section class="panel">
         <h2>📋 לא משויכים <span class="cnt">${poolItems.length} עמדות · ${poolTot} מחשבים</span></h2>
         <div class="pool drop" data-zone="">${poolItems.length?poolItems.map(cardHTML).join(""):`<div class="empty">אין מחשבים לא משויכים</div>`}</div>
       </section>
       <section><div class="zones">${zonesHTML}</div></section>
     </div>`;
}

function render(){
  const main = document.getElementById("main");
  main.className = viewMode;
  document.getElementById("viewTable").style.display = viewMode==="table" ? "" : "none";
  document.getElementById("viewCards").style.display = viewMode==="cards" ? "" : "none";
  document.getElementById("vTable").className = viewMode==="table" ? "on" : "";
  document.getElementById("vCards").className = viewMode==="cards" ? "on" : "";
  if (viewMode === "table") renderTable(); else renderCards();

  const all = comps();
  const total = all.reduce((s,c)=>s+c.count,0);
  const assigned = all.filter(c=>c.zone).reduce((s,c)=>s+c.count,0);
  let wS=0,wC=0; all.forEach(c=>{const a=ageOf(c); if(a!==null){wS+=a*c.count; wC+=c.count;}});
  document.getElementById("kTotal").textContent = total;
  document.getElementById("kRows").textContent = all.length;
  document.getElementById("kAssigned").textContent = assigned;
  document.getElementById("kAge").textContent = wC ? (wS/wC).toFixed(1) : "—";
  wire();
}

/* ============================ אירועים ============================ */
function wire(){
  document.querySelectorAll("[data-id][draggable]").forEach(el=>{
    el.addEventListener("dragstart", e=>{
      dragId = el.dataset.id; el.classList.add("dragging");
      e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain", dragId);
    });
    el.addEventListener("dragend", ()=>{ el.classList.remove("dragging"); dragId=null; });
  });
  document.querySelectorAll("[data-type]").forEach(s=>{
    s.addEventListener("change", ()=>{
      const id=s.dataset.type; state.computers[id].type = parseInt(s.value,10);
      push("computers/"+id+"/type", state.computers[id].type);
    });
  });
  document.querySelectorAll("[data-note]").forEach(i=>{
    i.addEventListener("change", ()=>{
      const id=i.dataset.note; state.computers[id].note = i.value;
      push("computers/"+id+"/note", i.value);
    });
  });
  document.querySelectorAll("[data-move]").forEach(s=>{
    s.addEventListener("change", ()=>{
      const id=s.dataset.move; moveTo(id, s.value);
    });
  });
  document.querySelectorAll("[data-split]").forEach(b=> b.onclick = ()=>splitDialog(b.dataset.split));
  document.querySelectorAll("[data-zrename]").forEach(b=> b.onclick = ()=>renameZone(b.dataset.zrename));
  document.querySelectorAll("[data-zdel]").forEach(b=> b.onclick = ()=>deleteZone(b.dataset.zdel));
  document.querySelectorAll("[data-zn]").forEach(el=> el.ondblclick = ()=>renameZone(el.dataset.zn));
}

function moveTo(id, zoneId){
  if (!state.computers[id]) return;
  state.computers[id].zone = zoneId || "";
  push("computers/"+id+"/zone", state.computers[id].zone);
  render();
}

let dragId = null;
document.addEventListener("dragover", e=>{
  const d = e.target.closest(".drop"); if(!d) return;
  e.preventDefault(); e.dataTransfer.dropEffect="move";
  document.querySelectorAll(".drop.over").forEach(x=>x.classList.remove("over"));
  d.classList.add("over");
});
document.addEventListener("dragleave", e=>{
  const d = e.target.closest(".drop");
  if (d && !d.contains(e.relatedTarget)) d.classList.remove("over");
});
document.addEventListener("drop", e=>{
  const d = e.target.closest(".drop"); if(!d) return;
  e.preventDefault(); d.classList.remove("over");
  const id = dragId || e.dataTransfer.getData("text/plain");
  if (id) moveTo(id, d.dataset.zone||"");
});

/* ============================ מתחמים ============================ */
function newZone(){
  openDialog("מתחם חדש",
    `<label style="display:block;font-size:13px;margin-bottom:6px">שם המתחם</label>
     <input type="text" id="zn" style="width:100%" placeholder="למשל: מעבדות קומה עליונה">`,
    [{txt:"צור", fn:()=>{
      const v=document.getElementById("zn").value.trim(); if(!v) return;
      const id = "z"+Date.now().toString(36);
      state.zones[id] = {name:v, order:Object.keys(state.zones).length};
      push("zones/"+id, state.zones[id]);
      render(); closeDialog(); toast("נוצר מתחם: "+v);
    }},{txt:"ביטול", cls:"ghost", fn:closeDialog}]);
  setTimeout(()=>document.getElementById("zn").focus(),50);
}
function renameZone(id){
  const z = state.zones[id]; if(!z) return;
  openDialog("שינוי שם מתחם", `<input type="text" id="zn" style="width:100%" value="${esc(z.name)}">`,
    [{txt:"שמור", fn:()=>{
      const v=document.getElementById("zn").value.trim();
      if(v){ z.name=v; push("zones/"+id+"/name", v); render(); }
      closeDialog();
    }},{txt:"ביטול", cls:"ghost", fn:closeDialog}]);
  setTimeout(()=>{const i=document.getElementById("zn"); i.focus(); i.select();},50);
}
function deleteZone(id){
  const z = state.zones[id]; if(!z) return;
  const n = comps().filter(c=>c.zone===id).length;
  openDialog("מחיקת מתחם",
    `<p>למחוק את המתחם <b>${esc(z.name)}</b>?</p>
     <p style="color:var(--muted);font-size:13px;margin-top:8px">${n} עמדות יחזרו ללא-משויכים. הנתונים עצמם לא נמחקים.</p>`,
    [{txt:"מחק", cls:"danger", fn:()=>{
      const u = {}; u["zones/"+id] = null;
      comps().forEach(c=>{ if(c.zone===id){ c.zone=""; u["computers/"+c.id+"/zone"]=""; } });
      delete state.zones[id];
      pushMulti(u); render(); closeDialog(); toast("המתחם נמחק");
    }},{txt:"ביטול", cls:"ghost", fn:closeDialog}]);
}
function splitDialog(id){
  const c = state.computers[id];
  if(!c || c.count<2){ toast("אפשר לפצל רק קבוצה של 2 מחשבים ומעלה"); return; }
  openDialog("פיצול קבוצה — "+esc(c.loc),
    `<p style="font-size:13px;color:var(--muted);margin-bottom:10px">בקבוצה ${c.count} מחשבים. כמה להוציא לכרטיס נפרד?</p>
     <input type="number" id="sn" min="1" max="${c.count-1}" value="1" style="width:100%">`,
    [{txt:"פצל", fn:()=>{
      const n=parseInt(document.getElementById("sn").value,10);
      if(!n||n<1||n>=c.count) return;
      const nid = c.id+"_s"+Date.now().toString(36);
      state.computers[nid] = Object.assign({}, c, {id:nid, count:n, zone:c.zone});
      c.count -= n;
      const u = {}; u["computers/"+nid]=state.computers[nid]; u["computers/"+c.id+"/count"]=c.count;
      pushMulti(u); render(); closeDialog(); toast("פוצלו "+n+" מחשבים");
    }},{txt:"ביטול", cls:"ghost", fn:closeDialog}]);
}

/* ============================ דיאלוג + טוסט ============================ */
const dlg = document.getElementById("dlg");
function openDialog(title, bodyHTML, buttons){
  document.getElementById("dlgTitle").textContent = title;
  document.getElementById("dlgBody").innerHTML = bodyHTML;
  const f = document.getElementById("dlgFoot"); f.innerHTML="";
  buttons.forEach(b=>{ const x=document.createElement("button"); x.textContent=b.txt; if(b.cls)x.className=b.cls; x.onclick=b.fn; f.appendChild(x); });
  dlg.showModal();
}
function closeDialog(){ dlg.close(); }
let toastTimer;
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),3200);
}

/* ============================ ייצוא לאקסל ============================ */
async function exportXlsx(){
  const wbk = new ExcelJS.Workbook();
  wbk.creator = "מערכת ניהול מחשבים - טכנודע";

  const ws = wbk.addWorksheet("סטטוס מחשב", {views:[{rightToLeft:true, state:"frozen", ySplit:3}]});
  const groups=[1,2,3], subs=["כמות מחשבים כללית","דגם","שנת רכישה","כמות","בעיות"];
  const h2=["מיקום"], h3=[""];
  groups.forEach(g=>{ h2.push(TYPE_NAMES[g],"","","",""); subs.forEach(s=>h3.push(s)); });
  ws.addRow(["סטטוס מחשב בטכנודע"]); ws.addRow(h2); ws.addRow(h3);
  const LAST = 1 + groups.length*subs.length;
  ws.mergeCells(1,1,1,LAST); ws.mergeCells(2,1,3,1);
  groups.forEach((g,i)=>{ const s=2+i*subs.length; ws.mergeCells(2,s,2,s+subs.length-1); });

  const zs = zoneList();
  const buckets = zs.map(z=>({name:z.name, items:comps().filter(c=>c.zone===z.id)}));
  const un = comps().filter(c=>!c.zone);
  if (un.length) buckets.push({name:"ללא שיוך למתחם", items:un});

  const totals={};
  buckets.forEach(b=>{
    const row=[b.name];
    groups.forEach(g=>{
      const it=b.items.filter(c=>c.type==g);
      const tot=it.reduce((s,c)=>s+c.count,0);
      totals[g]=(totals[g]||0)+tot;
      row.push(tot||"", it.map(c=>c.model||"—").join(" / "), it.map(c=>c.year||"—").join(" / "),
               it.map(c=>c.count).join(" / "), it.map(c=>c.note).filter(Boolean).join(" · "));
    });
    ws.addRow(row);
  });
  const tr=["סה\"כ"]; groups.forEach(g=>tr.push(totals[g]||0,"","","",""));
  ws.addRow(tr);

  const lastRow=ws.rowCount, GC=["FF0B5FA5","FF176FBF","FF2E86D6"];
  ws.getRow(1).height=26;
  styleCell(ws.getCell(1,1), {bold:true,size:14,fill:"FF20344A",font:"FFFFFFFF",center:true});
  for(let c=1;c<=LAST;c++){
    if(c===1) styleCell(ws.getCell(2,c), {bold:true,fill:"FF4A5A6A",font:"FFFFFFFF",center:true});
    else{
      styleCell(ws.getCell(2,c), {bold:true,fill:GC[Math.floor((c-2)/subs.length)],font:"FFFFFFFF",center:true});
      styleCell(ws.getCell(3,c), {bold:true,fill:"FFE8EEF5",center:true,size:10});
    }
  }
  for(let r=4;r<=lastRow;r++) for(let c=1;c<=LAST;c++){
    const cell=ws.getCell(r,c); cell.border=box();
    if(c===1) cell.font={bold:true,name:"Arial",size:11};
    else cell.alignment={horizontal:"center",vertical:"middle",wrapText:true};
    if(r===lastRow) styleCell(cell,{bold:true,fill:"FFD9D9D9"});
  }
  ws.getColumn(1).width=30;
  for(let c=2;c<=LAST;c++) ws.getColumn(c).width=[16,26,14,12,24][(c-2)%subs.length];

  const d = wbk.addWorksheet("פירוט מלא", {views:[{rightToLeft:true, state:"frozen", ySplit:1}]});
  d.addRow(["מתחם","מיקום","סוג מחשב","כמות","דגם","מערכת הפעלה","מעבד","דור","שנת רכישה משוערת","גיל (שנים)","זכרון","דחיפות החלפה","המלצה לביצוע","בעיות / הערות","מתחם מקורי"]);
  const zn={}; zs.forEach(z=>zn[z.id]=z.name);
  comps().sort((a,b)=>{
    const za=a.zone?zn[a.zone]:"￿", zb=b.zone?zn[b.zone]:"￿";
    return za.localeCompare(zb,"he") || sortRows(a,b);
  }).forEach(c=>{
    const a=ageOf(c);
    d.addRow([c.zone?zn[c.zone]:"ללא שיוך", c.loc, TYPE_SHORT[c.type], c.count, c.model||"", c.os||"",
              c.cpu||"", c.gen||"", c.year||"", a===null?"":a, c.ram||"", c.urgency||"", c.action||"", c.note||"", c.site||""]);
  });
  d.getRow(1).eachCell(c=>styleCell(c,{bold:true,fill:"FF0B5FA5",font:"FFFFFFFF",center:true}));
  [22,28,18,8,24,12,14,7,12,10,9,28,20,24,14].forEach((w,i)=>d.getColumn(i+1).width=w);
  d.eachRow((r,i)=>{ if(i>1) r.eachCell(c=>c.border=box()); });
  d.autoFilter={from:{row:1,column:1}, to:{row:d.rowCount,column:15}};

  const s = wbk.addWorksheet("סיכום", {views:[{rightToLeft:true}]});
  s.addRow(["טווח גיל","מחשבים","עמדות","אחוז"]);
  const bands=[["12 שנים ומעלה",a=>a!==null&&a>=12],["9–11 שנים",a=>a!==null&&a>=9&&a<12],
    ["6–8 שנים",a=>a!==null&&a>=6&&a<9],["3–5 שנים",a=>a!==null&&a>=3&&a<6],
    ["עד שנתיים",a=>a!==null&&a<3],["ללא נתון",a=>a===null]];
  const tot=comps().reduce((x,c)=>x+c.count,0);
  bands.forEach(([l,t])=>{ const it=comps().filter(c=>t(ageOf(c))); const n=it.reduce((x,c)=>x+c.count,0);
    s.addRow([l,n,it.length,tot?n/tot:0]); });
  s.addRow(["סה\"כ",tot,comps().length,1]);
  s.getColumn(4).numFmt="0.0%";
  s.getRow(1).eachCell(c=>styleCell(c,{bold:true,fill:"FF0B5FA5",font:"FFFFFFFF",center:true}));
  s.getRow(s.rowCount).eachCell(c=>styleCell(c,{bold:true,fill:"FFD9D9D9"}));
  [22,12,12,12].forEach((w,i)=>s.getColumn(i+1).width=w);
  s.eachRow(r=>r.eachCell(c=>c.border=box()));

  const buf = await wbk.xlsx.writeBuffer();
  const blob = new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="סטטוס מחשבים - טכנודע "+new Date().toISOString().slice(0,10)+".xlsx";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500);
  toast("הקובץ יוצא בהצלחה");
}
function styleCell(cell,o){
  if(o.fill) cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:o.fill}};
  cell.font={bold:!!o.bold,size:o.size||11,name:"Arial",color:{argb:o.font||"FF1F2933"}};
  cell.alignment={horizontal:o.center?"center":"right",vertical:"middle",wrapText:true};
  cell.border=box();
}
function box(){ const t={style:"thin",color:{argb:"FFB8C2CC"}}; return {top:t,left:t,bottom:t,right:t}; }
